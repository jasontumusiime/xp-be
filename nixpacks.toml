[phases.install]
cmds = [
  "pip install fastapi[standard] python-multipart email-validator tenacity pydantic emails jinja2 alembic httpx 'psycopg[binary]' sqlmodel pydantic-settings 'sentry-sdk[fastapi]' pyjwt 'pwdlib[argon2,bcrypt]' slowapi africastalking firebase-admin"
]

[start]
cmd = "alembic upgrade head && python app/initial_data.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
